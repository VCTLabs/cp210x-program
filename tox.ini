[tox]
envlist = py3{9,10,11,12,13}-{linux,macos,windows}
skip_missing_interpreters = true
isolated_build = true
skipsdist = True

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[base]
deps =
    pip>=23.1
    setuptools_scm[toml]

[build]
deps =
    pip>=23.1
    build
    twine

[testenv]
description =
    Default test environment for Python version/gh-action test matrix

passenv =
    pythonLocation
    CI
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE

#setenv = PYTHONPATH = {toxinidir}

allowlist_externals =
    bash
    diff

deps =
    {[base]deps}
    -r requirements.txt
    pytest
    -e .

commands =
    # first generate some test output for pytest
    bash -c 'cp210x-program.py -pc -F testdata/cp2102-orig.hex -f testdata/test.out'
    bash -c 'cp210x-program.py -pc -F testdata/cp2102-orig.hex > testdata/test2.out'
    pytest -v --capture=no test_platform_data.py

[testenv:lint]
skip_install = true

description =
    Linting environment using Pylint with normal pip install

passenv =
    pythonLocation
    CI
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE

deps =
    {[base]deps}
    pylint
    -rrequirements.txt

commands =
    pylint --fail-under=7 cp210x/ scripts/

[testenv:build]
skip_install = true
always_copy = False

description =
    PEP517 package build and metadata check

passenv =
    pythonLocation
    CI
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE

deps =
    {[build]deps}

commands =
    python -m build .
    twine check dist/*

[testenv:check]
skip_install = true
always_copy = False

description =
    Install check for built wheel package (clean venv with no extra deps)

passenv =
    PYTHON
    pythonLocation
    CI
    GITHUB*
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE

allowlist_externals =
    bash

deps =
    pip>=23.1

commands =
    bash -c 'python -m pip install dist/*.whl --force-reinstall --prefer-binary'
    python -m pip show -f cp210x_program
    bash -c 'cp210x-program.py --version'

[testenv:readhex]
passenv =
    CI
    PYTHON
    PYTHONIOENCODING
skip_install = true

allowlist_externals =
    bash

deps =
    pip>=23.1

commands =
    bash -c 'python -m pip install dist/*.whl --force-reinstall --prefer-binary'
    cp210x-program.py --read-cp210x -f readhex.out

[testenv:read]
passenv =
    CI
    PYTHON
    PYTHONIOENCODING
skip_install = true

allowlist_externals =
    bash

deps =
    pip>=23.1
    -rrequirements.txt

commands =
    python scripts/usb_read_cp210x.py

[testenv:badge]
envdir = {toxinidir}/.env
skip_install = true

passenv =
    pythonLocation
    CC
    CXX
    CI
    GITHUB*
    PIP_DOWNLOAD_CACHE

allowlist_externals =
    make
    cp

deps =
    pip>=23.1
    this-cli
    -rrequirements.txt

commands =
    # sadly this-cli cannot pass args to configure
    make -C ext/badge
    cp ext/badge/bin/cp2102 {envbindir}/
    cp2102 {posargs}

[testenv:clean]
envdir = {toxinidir}/.env
skip_install = true

passenv =
    pythonLocation
    CC
    CXX
    CI
    GITHUB*
    PIP_DOWNLOAD_CACHE

allowlist_externals =
    bash

deps =
    pip>=20.3

commands =
    bash -c 'rm -rf ./ext/badge/bin __pycache__ cp210x_program.egg-info dist'
